<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crawlr</title>
<meta name="description" content="Happy hours and bar deals across Mumbai, nearest first, with a bar-hop planner.">
<meta name="theme-color" content="#0B0A09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315110D'/%3E%3Cpath d='M9 7h14l-2 18H11z' fill='none' stroke='%23E3A44A' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M10 13h12l-1.3 11H11.3z' fill='%23E3A44A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="glass" aria-hidden="true"></span>crawlr</div>
    <button class="now" id="nowBtn" type="button" hidden><svg class="i"><use href="#i-now"/></svg>Now</button>
  </header>

  <h1 class="hero">Happy hour,<br>near <span class="badge" aria-hidden="true"><svg class="i"><use href="#i-beer"/></svg></span> you.</h1>
  <div class="areas" id="areas" role="radiogroup" aria-label="Near"></div>

  <div class="controls">
    <label class="sel" title="Day"><svg class="i"><use href="#i-cal"/></svg><select id="day" aria-label="Day"></select></label>
    <label class="sel" title="Time"><svg class="i"><use href="#i-clock"/></svg><input id="time" type="time" step="900" aria-label="Time"></label>
  </div>

  <section id="deals" role="tabpanel" aria-labelledby="tabDeals">
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" type="button" data-f="all" aria-pressed="true"><svg class="i"><use href="#i-glasses"/></svg>All</button>
      <button class="chip" type="button" data-f="2for1"><svg class="i"><use href="#i-cheers"/></svg>1+1</button>
      <button class="chip" type="button" data-f="late"><svg class="i"><use href="#i-moon"/></svg>Late</button>
      <button class="chip" type="button" data-f="women"><svg class="i"><use href="#i-wine"/></svg>Ladies' night</button>
    </div>
    <p class="summary" id="summary"></p>
    <div id="list"></div>
  </section>

  <section id="crawl" role="tabpanel" aria-labelledby="tabCrawl" hidden>
    <div class="plan">
      <div class="planrow">
        <label class="sel" title="Stops"><svg class="i"><use href="#i-route"/></svg><select id="stops" aria-label="Stops"><option value="2">2 stops</option><option value="3" selected>3 stops</option><option value="4">4 stops</option><option value="5">5 stops</option></select></label>
        <label class="sel" title="Time at each bar"><svg class="i"><use href="#i-clock"/></svg><select id="stay" aria-label="Time at each bar"><option value="45">45 min each</option><option value="60" selected>1 hr each</option><option value="90">1.5 hr each</option></select></label>
      </div>
      <div class="planrow">
        <label class="toggle" title="When no deal is running, stop at a nearby open bar"><input type="checkbox" id="fill" checked><span></span>Fill gaps</label>
        <label class="toggle" title="Include bars whose hours aren't listed on Google"><input type="checkbox" id="incUnconf"><span></span>Unverified bars</label>
      </div>
      <button class="go" type="button" id="planBtn"><svg class="i"><use href="#i-route"/></svg>Plan my crawl</button>
    </div>
    <div id="crawlOut"></div>
  </section>

  <footer class="fine"><svg class="i"><use href="#i-info"/></svg><span>Deals change often, so check before you go. 25+ for spirits. Cab between stops.</span></footer>
  <p class="fine updated" id="updated"></p>
</div>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" id="tabDeals" aria-selected="true" aria-controls="deals"><svg class="i"><use href="#i-glasses"/></svg>Deals</button>
  <button class="tab" role="tab" id="tabCrawl" aria-selected="false" aria-controls="crawl"><svg class="i"><use href="#i-route"/></svg>Crawl<span class="count" id="crawlCount"></span></button>
</nav>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-beer" viewBox="0 0 24 24"><path d="M6 9h9v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M15 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 9a3 3 0 0 1 2.4-2.9A3.5 3.5 0 0 1 15 6.5 2.5 2.5 0 0 1 15 9"/><path d="M9.5 13v4M12 13v4"/></symbol>
    <symbol id="i-wine" viewBox="0 0 24 24"><path d="M8 3h8l-.4 5.2a3.6 3.6 0 0 1-7.2 0z"/><path d="M8.3 7h7.4"/><path d="M12 11.8V20M8.5 20.5h7"/></symbol>
    <symbol id="i-cocktail" viewBox="0 0 24 24"><path d="M4 5h16l-8 8.5z"/><path d="M12 13.5V20M8 20.5h8"/><path d="M15 5l3-2.5"/><circle cx="18.5" cy="2.8" r=".6"/></symbol>
    <symbol id="i-shot" viewBox="0 0 24 24"><path d="M7 5h10l-1.4 15h-7.2z"/><path d="M7.6 11h8.8"/></symbol>
    <symbol id="i-cheers" viewBox="0 0 24 24"><path d="M4 6l5.5-1.5 1.6 6a3 3 0 0 1-5.8 1.6z"/><path d="M8.3 13.7l1.6 6M7.5 20.4l4.3-1.2"/><path d="M20 6l-5.5-1.5-1.6 6a3 3 0 0 0 5.8 1.6z"/><path d="M15.7 13.7l-1.6 6M16.5 20.4l-4.3-1.2"/></symbol>
    <symbol id="i-glasses" viewBox="0 0 24 24"><path d="M3.5 7h7l-1 12h-5z"/><path d="M13.5 9h7l-1 10h-5z"/><path d="M4 11h6M14 12.5h6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11.5a7 7 0 0 0-14 0C5 15 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16v-4l2-5h10l2 5v4"/><rect x="3" y="12" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5M12 17.2v.2"/></symbol>
    <symbol id="i-now" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 10v10h16V10"/><path d="M3 10l2-6h14l2 6z"/><path d="M10 20v-5h4v5"/></symbol>
  </defs>
</svg>
<script src="app.js"></script>
</body>
</html>
